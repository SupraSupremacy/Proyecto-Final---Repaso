<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Repaso de Módulos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="cyber-header">
        <div class="header-inner">
            <span class="logo">NEON<span class="accent">CORE</span></span>
            <nav class="cyber-nav">
                <a href="{{ url_for('index') }}" class="nav-link {% if title=='Home' %}active{% endif %}">Menú Principal</a>
                {% for m in range(1,5) %}
                <a href="{{ url_for('modulo', slug='modulo' + (m|string)) }}" class="nav-link {% if title=='Módulo '+(m|string) %}active{% endif %}">Módulo {{ m }}</a>
                {% endfor %}
            </nav>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer class="cyber-footer">
        <span>© 2026 NEONCORE SYS // BOOT SEQUENCE COMPLETE</span>
    </footer>
</body>
</html>
